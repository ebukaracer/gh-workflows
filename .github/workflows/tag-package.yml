name: Tag repository from package.json

on:
  workflow_call:
    inputs:
      package_json:
        description: 'Path to package.json'
        required: false
        type: string
        default: 'src/package.json'

      target_branch:
        description: 'Branch containing package.json and commit to tag'
        required: false
        type: string
        default: ''

      tag_prefix:
        description: 'Prefix for the tag'
        required: false
        type: string
        default: 'v'

      dry_run:
        description: 'If true, do not create or push the tag'
        required: false
        type: boolean
        default: false

jobs:
  tag:
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Checkout branch containing package.json
      # ------------------------------------------------------------

      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.target_branch || github.ref_name }}
          fetch-depth: 0

      # ------------------------------------------------------------
      # Read version
      # ------------------------------------------------------------

      - name: Read version from package.json
        id: version
        env:
          PACKAGE_JSON: ${{ inputs.package_json }}
        run: |
          if [ ! -f "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json not found:"
            echo "$PACKAGE_JSON"
            exit 1
          fi

          VERSION=$(jq -r '.version' "$PACKAGE_JSON")

          if [[ -z "$VERSION" || "$VERSION" == "null" ]]; then
            echo "ERROR: package.json version not found."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"

      # ------------------------------------------------------------
      # Prepare tag
      # ------------------------------------------------------------

      - name: Prepare tag
        id: prep
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          TAG="${TAG_PREFIX}${VERSION}"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"

      # ------------------------------------------------------------
      # Read commit being tagged
      #
      # This deliberately uses HEAD instead of GITHUB_SHA because
      # target_branch may be different from the branch that
      # originally triggered the caller workflow.
      # ------------------------------------------------------------

      - name: Get target commit
        id: commit
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%B HEAD)

          echo "commit_sha=$COMMIT_SHA" >> "$GITHUB_OUTPUT"

          {
            echo "commit_msg<<EOF"
            printf '%s\n' "$COMMIT_MSG"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Commit being tagged:"
          echo "$COMMIT_SHA"

      # ------------------------------------------------------------
      # Create tag
      # ------------------------------------------------------------

      - name: Create tag
        env:
          TAG: ${{ steps.prep.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
          COMMIT_MSG: ${{ steps.commit.outputs.commit_msg }}
        run: |
          echo "Tag: $TAG"
          echo "Dry run: $DRY_RUN"

          # Fetch tags first in case another workflow created one.
          git fetch origin --tags

          if git rev-parse \
            -q \
            --verify \
            "refs/tags/$TAG" \
            >/dev/null; then

            echo "Tag $TAG already exists. Skipping."
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            echo "Dry run enabled."
            echo "Would create tag: $TAG"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git tag \
            -a "$TAG" \
            -m "$COMMIT_MSG"

          git push origin "$TAG"

          echo "Created tag: $TAG"
